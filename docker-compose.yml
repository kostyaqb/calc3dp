version: '3.8'

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-default_secret_change_me}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - db_data:/app/data
    restart: unless-stopped

volumes:
  db_data:
